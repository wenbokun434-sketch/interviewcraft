version: 2

project_name: interviewcraft
report_sizes: true

before:
  hooks:
    - go mod verify

builds:
  - id: interviewcraft
    main: ./cmd/interviewcraft
    binary: interviewcraft
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/interviewcraft/interviewcraft/internal/version.ApplicationVersion={{ .Version }}
      - -X github.com/interviewcraft/interviewcraft/internal/version.GitCommit={{ .Commit }}
      - -X github.com/interviewcraft/interviewcraft/internal/version.BuildTime={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - interviewcraft
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - docs/DEPLOYMENT.md
      - docs/SECURITY.md
      - scripts/install.ps1
      - scripts/install.sh
      - scripts/uninstall.ps1
      - scripts/uninstall.sh
      - scripts/cosign-v3.1.3-sha256.txt

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
