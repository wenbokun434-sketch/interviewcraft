name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COSIGN_VERSION: v3.1.3
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      CERTIFICATE_IDENTITY_PREFIX: https://github.com/wenbokun434-sketch/interviewcraft/.github/workflows/release.yml@refs/tags/
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Run complete release gate
        shell: pwsh
        run: ./scripts/test-release-quality.ps1

      - name: Normalize tagged application version
        id: release-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU for Runner platforms
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 Runner
        id: runner-amd64
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: docker/runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/wenbokun434-sketch/interviewcraft-runner:${{ github.ref_name }}-amd64
          build-args: |
            APPLICATION_VERSION=${{ steps.release-version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            RUNNER_PROTOCOL=interviewcraft-runner-response-v1
          provenance: mode=max
          sbom: true

      - name: Build and push arm64 Runner
        id: runner-arm64
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: docker/runner
          platforms: linux/arm64
          push: true
          tags: ghcr.io/wenbokun434-sketch/interviewcraft-runner:${{ github.ref_name }}-arm64
          build-args: |
            APPLICATION_VERSION=${{ steps.release-version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            RUNNER_PROTOCOL=interviewcraft-runner-response-v1
          provenance: mode=max
          sbom: true

      - name: Install pinned Syft for SPDX generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/anchore/syft/cmd/syft@v1.44.0
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build release assets locally without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: release --clean --skip=publish

      - name: Generate and verify strict release manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./scripts/release-manifest.ps1 `
            -Mode Generate `
            -DistDirectory ./dist `
            -Version $version `
            -Commit $env:GITHUB_SHA

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign Runner digests and generate strict Runner manifest
        shell: bash
        env:
          AMD64_DIGEST: ${{ steps.runner-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.runner-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          repository=ghcr.io/wenbokun434-sketch/interviewcraft-runner
          identity="${CERTIFICATE_IDENTITY_PREFIX}${GITHUB_REF_NAME}"
          cosign sign --yes "${repository}@${AMD64_DIGEST}"
          cosign sign --yes "${repository}@${ARM64_DIGEST}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${OIDC_ISSUER}" "${repository}@${AMD64_DIGEST}"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${OIDC_ISSUER}" "${repository}@${ARM64_DIGEST}"
          pwsh -NoProfile -File ./scripts/runner-manifest.ps1 \
            -Mode Generate -DistDirectory ./dist -Version "${GITHUB_REF_NAME#v}" \
            -Commit "${GITHUB_SHA}" -AMD64Digest "${AMD64_DIGEST}" -ARM64Digest "${ARM64_DIGEST}"
          cosign sign-blob --yes --bundle dist/runner-manifest.sigstore.json dist/runner-manifest.txt
          cosign verify-blob --bundle dist/runner-manifest.sigstore.json \
            --certificate-identity "${identity}" --certificate-oidc-issuer "${OIDC_ISSUER}" \
            dist/runner-manifest.txt

      - name: Sign and verify manifest with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          identity="${CERTIFICATE_IDENTITY_PREFIX}${GITHUB_REF_NAME}"
          cosign sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.txt
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            dist/release-manifest.txt

      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Stage provenance bundle as a release asset
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "${PROVENANCE_BUNDLE}" dist/release-provenance.sigstore.json

      - name: Create draft release and upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/interviewcraft_*.tar.gz \
            dist/interviewcraft_*.zip \
            dist/checksums.txt \
            dist/*.spdx.json \
            dist/release-manifest.txt \
            dist/release-manifest.sigstore.json \
            dist/release-provenance.sigstore.json \
            dist/runner-manifest.txt \
            dist/runner-manifest.sigstore.json \
            scripts/install.ps1 \
            scripts/install.sh \
            scripts/uninstall.ps1 \
            scripts/uninstall.sh \
            scripts/cosign-v3.1.3-sha256.txt

      - name: Download draft assets and verify before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          identity="${CERTIFICATE_IDENTITY_PREFIX}${GITHUB_REF_NAME}"
          verify_dir="${RUNNER_TEMP}/interviewcraft-release-verify"
          mkdir -p "${verify_dir}"
          gh release download "${GITHUB_REF_NAME}" --dir "${verify_dir}"
          pwsh -NoProfile -File ./scripts/release-manifest.ps1 \
            -Mode Verify \
            -DistDirectory "${verify_dir}" \
            -Version "${version}" \
            -Commit "${GITHUB_SHA}"
          cosign verify-blob \
            --bundle "${verify_dir}/release-manifest.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${verify_dir}/release-manifest.txt"
          pwsh -NoProfile -File ./scripts/runner-manifest.ps1 \
            -Mode Verify -DistDirectory "${verify_dir}" -Version "${version}" -Commit "${GITHUB_SHA}"
          while IFS=$'\t' read -r kind _os _arch repository digest _protocol _user; do
            if test "${kind}" = image; then
              cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${OIDC_ISSUER}" "${repository}@${digest}"
            fi
          done < "${verify_dir}/runner-manifest.txt"
          cosign verify-blob --bundle "${verify_dir}/runner-manifest.sigstore.json" \
            --certificate-identity "${identity}" --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${verify_dir}/runner-manifest.txt"
          gh attestation verify \
            "${verify_dir}/interviewcraft_${version}_linux_amd64.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${verify_dir}/release-provenance.sigstore.json"
          extract_dir="${verify_dir}/linux-amd64"
          mkdir -p "${extract_dir}"
          tar -xzf "${verify_dir}/interviewcraft_${version}_linux_amd64.tar.gz" -C "${extract_dir}"
          version_json="$("${extract_dir}/interviewcraft" version --json)"
          test "$(jq -r .schema_version <<<"${version_json}")" = "interviewcraft-version-v1"
          test "$(jq -r .version <<<"${version_json}")" = "${version}"
          test "$(jq -r .git_commit <<<"${version_json}")" = "${GITHUB_SHA}"

      - name: Publish only after all downloaded assets pass verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
