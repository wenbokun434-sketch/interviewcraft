name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COSIGN_VERSION: v3.1.3
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      CERTIFICATE_IDENTITY_PREFIX: https://github.com/wenbokun434-sketch/interviewcraft/.github/workflows/release.yml@refs/tags/
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum

      - name: Run complete release gate
        shell: pwsh
        run: ./scripts/test-release-quality.ps1

      - name: Install pinned Syft for SPDX generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/anchore/syft/cmd/syft@v1.44.0
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build release assets locally without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.15.4'
          args: release --clean --skip=publish

      - name: Generate and verify strict release manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./scripts/release-manifest.ps1 `
            -Mode Generate `
            -DistDirectory ./dist `
            -Version $version `
            -Commit $env:GITHUB_SHA

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign and verify manifest with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          identity="${CERTIFICATE_IDENTITY_PREFIX}${GITHUB_REF_NAME}"
          cosign sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.txt
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            dist/release-manifest.txt

      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Stage provenance bundle as a release asset
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "${PROVENANCE_BUNDLE}" dist/release-provenance.sigstore.json

      - name: Create draft release and upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/interviewcraft_*.tar.gz \
            dist/interviewcraft_*.zip \
            dist/checksums.txt \
            dist/*.spdx.json \
            dist/release-manifest.txt \
            dist/release-manifest.sigstore.json \
            dist/release-provenance.sigstore.json

      - name: Download draft assets and verify before publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          identity="${CERTIFICATE_IDENTITY_PREFIX}${GITHUB_REF_NAME}"
          verify_dir="${RUNNER_TEMP}/interviewcraft-release-verify"
          mkdir -p "${verify_dir}"
          gh release download "${GITHUB_REF_NAME}" --dir "${verify_dir}"
          pwsh -NoProfile -File ./scripts/release-manifest.ps1 \
            -Mode Verify \
            -DistDirectory "${verify_dir}" \
            -Version "${version}" \
            -Commit "${GITHUB_SHA}"
          cosign verify-blob \
            --bundle "${verify_dir}/release-manifest.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${verify_dir}/release-manifest.txt"
          gh attestation verify \
            "${verify_dir}/interviewcraft_${version}_linux_amd64.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "${verify_dir}/release-provenance.sigstore.json"
          extract_dir="${verify_dir}/linux-amd64"
          mkdir -p "${extract_dir}"
          tar -xzf "${verify_dir}/interviewcraft_${version}_linux_amd64.tar.gz" -C "${extract_dir}"
          version_json="$("${extract_dir}/interviewcraft" version --json)"
          test "$(jq -r .schema_version <<<"${version_json}")" = "interviewcraft-version-v1"
          test "$(jq -r .version <<<"${version_json}")" = "${version}"
          test "$(jq -r .git_commit <<<"${version_json}")" = "${GITHUB_SHA}"

      - name: Publish only after all downloaded assets pass verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
