name: deployment-e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  user-deployment:
    name: ${{ matrix.os }} one-command lifecycle
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Run documented Windows clean deployment lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-deployment-e2e.ps1 -GoBinary go -EvidencePath .\deployment-evidence.json
      - name: Run documented POSIX clean deployment lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: pwsh -NoProfile -File ./scripts/test-deployment-e2e.ps1 -GoBinary go -EvidencePath ./deployment-evidence.json
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-${{ runner.os }}
          path: deployment-evidence.json
          if-no-files-found: error

  full-practice:
    name: ubuntu signed Full Practice and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Run Full Practice deployment and Runner isolation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-deployment-e2e.ps1 -GoBinary go -FullPractice -EvidencePath ./deployment-evidence-full.json
      - name: Upload Full Practice evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-full-practice
          path: deployment-evidence-full.json
          if-no-files-found: error
